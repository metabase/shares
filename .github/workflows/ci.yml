# Tests on every PR and push to main; deploy to the Metabase Cloudflare account
# (wrangler.toml [env.metabase]) after tests pass on main.
#
# The repo is public. Only the deploy job reads a secret, and only through the
# "production" environment, whose branch policy allows main only. PRs, fork PRs
# included, run the test job with a read-only token and no secrets. Never add
# pull_request_target here.
#
# CLOUDFLARE_API_TOKEN (environment secret): account-owned token of account
# Metabase with Workers: Editor on Worker `shares`, D1: Edit, and
# Zone metabase.fyi: Workers Routes: Write (custom domains).
#
# The release job calls release.yml after the deploy: a new CLI release never
# reaches users before the worker it needs is live. It releases only when the
# CLI changed (see release.yml). It is the only job with contents: write.
# workflow_dispatch with release_dry_run runs the release path on any branch,
# builds the binaries and publishes nothing.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the CLI release path; build only, publish nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.shares.metabase.fyi
    # one deploy at a time; a newer push waits, it does not cancel a running deploy
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 4f68a0299231e43ec1c7f75c50d21cb6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun x wrangler d1 migrations apply shares --env metabase --remote
      - run: bun x wrangler deploy --env metabase

  release:
    needs: [test, deploy]
    if: >-
      always() && needs.test.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.release_dry_run))
    permissions:
      contents: write
      pull-requests: read
    # one release at a time, so that each run computes its version from the tags of the run before
    concurrency:
      group: cli-release
      cancel-in-progress: false
    uses: ./.github/workflows/release.yml
    with:
      dry_run: ${{ github.event_name != 'push' }}
