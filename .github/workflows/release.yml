# Release of the `share` CLI: push a tag cli-v<version> (cli-v0.1.0). A tag
# with a "-" (cli-v0.2.0-rc.1) makes a prerelease, which install.sh skips
# (it takes releases/latest).
#
# binaries: the four standalone binaries + SHA256SUMS on the GitHub release;
# install.sh (served by the worker at /install.sh) downloads them. Built on
# macOS: bun cross-compiles all four targets from there (finding
# bun-cross-compile-darwin).
# npm: @metabase/shares through npm trusted publishing (OIDC, no token
# secret). Environment "npm" gates it; the package on npmjs.com must name
# this repo and workflow as its trusted publisher.
name: release

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read

jobs:
  binaries:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun cli/build.ts "${GITHUB_REF_NAME#cli-v}"
      - run: |
          dist/share-darwin-arm64 --version
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#cli-v}"
          pre=""; case "$v" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/share-* dist/SHA256SUMS $pre \
            --repo "$GITHUB_REPOSITORY" --title "share CLI $v" \
            --notes "Install: curl -fsSL https://app.shares.metabase.fyi/install.sh | sh"

  npm:
    needs: binaries
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun cli/build.ts "${GITHUB_REF_NAME#cli-v}" npm
      - run: node dist/npm/share.js --version
      # trusted publishing needs npm 11.5.1 or later
      - working-directory: dist/npm
        run: |
          tag=latest; case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npx -y npm@11.6.2 publish --provenance --access public --tag "$tag"
