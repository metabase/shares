name = "mb-shares"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# bundle bin/share + skill/SKILL.md as text so the worker can serve them
# at /_cli and /_skill
[[rules]]
type = "Text"
globs = ["**/bin/share", "**/skill/SKILL.md"]
fallthrough = true

[[kv_namespaces]]
binding = "SHARES"
id = "8e746d88c3254e1b83b82eb02db9be0c"

# R2 + D1 store (decision replatform-r2-d1). Placeholder ids: `wrangler dev`
# runs both locally; SHR-2 sets the real ids of the Metabase account.
# Local D1: bun x wrangler d1 migrations apply shares --local
[[d1_databases]]
binding = "DB"
database_name = "shares"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "shares-blobs"

[vars]
# public OAuth client id -- set after creating the Google OAuth client
GOOGLE_CLIENT_ID = "1089089243557-frsr7vf4s7pja4b3uq33naughhh0gk1m.apps.googleusercontent.com"
ALLOWED_DOMAIN = "metabase.com"
ADMIN_EMAIL = "bryan@metabase.com"

# secrets (set via: bun x wrangler secret put <NAME>):
#   GOOGLE_CLIENT_SECRET  -- from the Google OAuth client
#   SESSION_SECRET        -- random, signs session cookies
#   UPLOAD_TOKEN          -- random, legacy admin CLI token (others mint theirs at /_token)

# pubshare: same code, public read-only deploy (`wrangler deploy --env pub`).
# No Google login; only the UPLOAD_TOKEN secret can write, acting as ADMIN_EMAIL.
#   bun x wrangler secret put UPLOAD_TOKEN --env pub
[env.pub]
name = "pubshare"

[[env.pub.kv_namespaces]]
binding = "SHARES"
id = "be3e6920240f4cebb6d0c0ab8d4c4f27"

[env.pub.vars]
PUBLIC = "1"
ADMIN_EMAIL = "bryan.maass@gmail.com"

# metabase: the Metabase Cloudflare account, zone metabase.fyi (SHR-2).
# CI (.github/workflows/ci.yml) deploys it on each push to main, after tests:
#   bun x wrangler d1 migrations apply shares --env metabase --remote
#   bun x wrangler deploy --env metabase
# shares.metabase.fyi holds share content only; app.shares.metabase.fyi holds the API,
# login, tokens and UI (lll decision two-hosts-on-metabase-fyi).
# main is a hello-world until the TS worker is ready to deploy here: it reads the
# SHARES KV binding until SHR-4 moves storeFor(env) to R2+D1.
# secrets: bun x wrangler secret put <NAME> --env metabase
#   SESSION_SECRET        -- random, signs session cookies
#   GOOGLE_CLIENT_SECRET  -- from the Internal OAuth client (SHR-3)
[env.metabase]
name = "shares"
account_id = "4f68a0299231e43ec1c7f75c50d21cb6"
main = "deploy/hello.js"
workers_dev = false
routes = [
  { pattern = "shares.metabase.fyi", custom_domain = true },
  { pattern = "app.shares.metabase.fyi", custom_domain = true },
]

[[env.metabase.d1_databases]]
binding = "DB"
database_name = "shares"
database_id = "9e247c0a-531b-4401-bcb0-2ac6293470e2"
migrations_dir = "migrations"

[[env.metabase.r2_buckets]]
binding = "BLOBS"
bucket_name = "shares-blobs"

[env.metabase.vars]
ALLOWED_DOMAIN = "metabase.com"
CONTENT_HOST = "shares.metabase.fyi"
APP_HOST = "app.shares.metabase.fyi"
