name = "mb-shares"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# bundle bin/share, skill/SKILL.md and cli/install.sh as text so the worker
# can serve them at /_cli, /_skill and /_install.sh
[[rules]]
type = "Text"
globs = ["**/bin/share", "**/skill/SKILL.md", "**/cli/install.sh"]
fallthrough = true

[[kv_namespaces]]
binding = "SHARES"
id = "8e746d88c3254e1b83b82eb02db9be0c"

# R2 + D1 store. Placeholder ids: `wrangler dev` runs both locally;
# [env.metabase] has the real ids of the Metabase account.
# Local D1: bun x wrangler d1 migrations apply shares --local
[[d1_databases]]
binding = "DB"
database_name = "shares"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "shares-blobs"

[vars]
# public id of the Internal OAuth client in the Metabase GCP org
GOOGLE_CLIENT_ID = "22970549836-hbrr8eiinejkmr5b68lst9mc6vd341no.apps.googleusercontent.com"
ALLOWED_DOMAIN = "metabase.com"
ADMIN_EMAIL = "bryan@metabase.com"
# PUBLIC_SHARING = "1"  -- owners can mark a share public (`share --public`),
# readable without login. Unset (default): off, the API refuses it.

# secrets (set via: bun x wrangler secret put <NAME>):
#   GOOGLE_CLIENT_SECRET  -- from the Google OAuth client
#   SESSION_SECRET        -- random, signs session cookies
#   UPLOAD_TOKEN          -- random, legacy admin CLI token (others mint theirs at /_token)

# pubshare: same code, public read-only deploy (`wrangler deploy --env pub`).
# No Google login; only the UPLOAD_TOKEN secret can write, acting as ADMIN_EMAIL.
#   bun x wrangler secret put UPLOAD_TOKEN --env pub
[env.pub]
name = "pubshare"

[[env.pub.kv_namespaces]]
binding = "SHARES"
id = "be3e6920240f4cebb6d0c0ab8d4c4f27"

[env.pub.vars]
PUBLIC = "1"
ADMIN_EMAIL = "bryan.maass@gmail.com"

# metabase: the Metabase Cloudflare account, zone metabase.fyi.
# CI (.github/workflows/ci.yml) deploys it on each push to main, after tests:
#   bun x wrangler d1 migrations apply shares --env metabase --remote
#   bun x wrangler deploy --env metabase
# shares.metabase.fyi holds share content only; app.shares.metabase.fyi holds the API,
# login, tokens and UI, so user HTML never runs on the origin that holds tokens.
# The TS worker with the D1+R2 store; no SHARES KV here. wrangler does not inherit
# top-level vars or bindings: a var the worker reads must also be in this env.
# secrets: bun x wrangler secret put <NAME> --env metabase
#   SESSION_SECRET        -- random, signs session cookies
#   GOOGLE_CLIENT_SECRET  -- from the Internal OAuth client
[env.metabase]
name = "shares"
account_id = "4f68a0299231e43ec1c7f75c50d21cb6"
main = "src/index.ts"
workers_dev = false
routes = [
  { pattern = "shares.metabase.fyi", custom_domain = true },
  { pattern = "app.shares.metabase.fyi", custom_domain = true },
]

[[env.metabase.d1_databases]]
binding = "DB"
database_name = "shares"
database_id = "9e247c0a-531b-4401-bcb0-2ac6293470e2"
migrations_dir = "migrations"

[[env.metabase.r2_buckets]]
binding = "BLOBS"
bucket_name = "shares-blobs"

[env.metabase.vars]
# public id of the Internal OAuth client in the Metabase GCP org
GOOGLE_CLIENT_ID = "22970549836-hbrr8eiinejkmr5b68lst9mc6vd341no.apps.googleusercontent.com"
ALLOWED_DOMAIN = "metabase.com"
CONTENT_HOST = "shares.metabase.fyi"
APP_HOST = "app.shares.metabase.fyi"
# admin: /_import, /_stats, /_audit, service tokens
ADMIN_EMAIL = "tyler@metabase.com"
# PUBLIC_SHARING is off here; set PUBLIC_SHARING = "1" to allow public shares
